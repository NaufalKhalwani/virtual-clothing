<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="app-bg-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Mesh Wireframe Accent Gradient -->
    <linearGradient id="app-grid-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Symbol Facet Gradients -->
    <linearGradient id="app-sym-left" x1="120" y1="120" x2="256" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="app-sym-right" x1="392" y1="120" x2="256" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="app-sym-collar" x1="200" y1="100" x2="312" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="app-symbol-shadow" x="40" y="60" width="432" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#app-bg-glow)" />
  <rect width="512" height="512" rx="116" stroke="url(#app-grid-grad)" stroke-width="3" />

  <!-- Background 3D Perspective Grid Accent -->
  <path d="M64,256 L448,256 M256,64 L256,448" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="180" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.06" fill="none" />

  <!-- Main 3D Apparel Prism Mark -->
  <g filter="url(#app-symbol-shadow)">
    <!-- Left Body & Left Sleeve -->
    <path
      d="M256,188 L170,230 L170,410 L256,444 L256,188 Z"
      fill="url(#app-sym-left)"
    />
    <path
      d="M256,188 L204,94 L76,172 L118,266 L170,230 L256,188 Z"
      fill="#2563EB"
    />

    <!-- Right Body & Right Sleeve -->
    <path
      d="M256,188 L342,230 L342,410 L256,444 L256,188 Z"
      fill="url(#app-sym-right)"
    />
    <path
      d="M256,188 L308,94 L436,172 L394,266 L342,230 L256,188 Z"
      fill="#3B82F6"
    />

    <!-- Dynamic V-Neck Collar Ribbon -->
    <path
      d="M204,94 L256,162 L308,94 L256,120 Z"
      fill="url(#app-sym-collar)"
    />

    <!-- Isometric Seams & Edges -->
    <path
      d="M256,188 L256,444"
      stroke="#DBEAFE"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.9"
    />
    <path
      d="M76,172 L204,94 L256,120 L308,94 L436,172 L394,266 L342,230 L342,410 L256,444 L170,410 L170,230 L118,266 Z"
      stroke="#BFDBFE"
      stroke-width="3"
      stroke-linejoin="round"
      opacity="0.45"
    />

    <!-- Apex 3D Light Reflection Core -->
    <circle cx="256" cy="188" r="9" fill="#FFFFFF" />
    <circle cx="256" cy="188" r="16" fill="#38BDF8" fill-opacity="0.35" />
  </g>
</svg>
