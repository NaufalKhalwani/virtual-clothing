<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="vl-left" x1="16" y1="12" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="vl-right" x1="48" y1="12" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Symbol on Left (Center: 32, 32) -->
  <g transform="translate(4, 4)">
    <!-- Ambient back -->
    <rect width="56" height="56" rx="14" fill="#EFF6FF" />

    <!-- 3D Apparel Facets -->
    <g transform="translate(4, 4) scale(0.4)">
      <path d="M60,44 L40,54 L40,96 L60,104 L60,44 Z" fill="url(#vl-left)" />
      <path d="M60,44 L48,22 L18,40 L28,62 L40,54 L60,44 Z" fill="#2563EB" />
      <path d="M60,44 L80,54 L80,96 L60,104 L60,44 Z" fill="url(#vl-right)" />
      <path d="M60,44 L72,22 L102,40 L92,62 L80,54 L60,44 Z" fill="#3B82F6" />
      <polygon points="48,22 60,38 72,22 60,28" fill="#93C5FD" />
      <line x1="60" y1="44" x2="60" y2="104" stroke="#DBEAFE" stroke-width="2.5" />
      <circle cx="60" cy="44" r="3.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography on Right -->
  <g transform="translate(74, 18)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="15" font-weight="800" fill="#0F172A" letter-spacing="-0.3">
      VIRTUAL CLOTHING
    </text>
    <text x="0" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="9" font-weight="600" fill="#2563EB" letter-spacing="1.8">
      3D APPAREL STUDIO
    </text>

    <!-- 3D Dimension Badge -->
    <rect x="164" y="3" width="28" height="16" rx="5" fill="#DBEAFE" />
    <text x="178" y="14.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="9" font-weight="800" fill="#1D4ED8" letter-spacing="0.5">
      3D
    </text>
  </g>
</svg>
