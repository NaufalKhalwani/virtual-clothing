<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="fav-l" x1="4" y1="6" x2="16" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="fav-r" x1="28" y1="6" x2="16" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Container Badge with subtle rounded corners -->
  <rect width="32" height="32" rx="8" fill="url(#fav-bg)" />
  <rect width="32" height="32" rx="8" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.25" />

  <!-- Garment 3D Facets -->
  <!-- Left Body & Sleeve -->
  <path d="M16,11 L10.5,14 L10.5,25 L16,27 Z" fill="url(#fav-l)" />
  <path d="M16,11 L13,5.5 L4.5,10.5 L7.5,16.5 L10.5,14 Z" fill="#2563EB" />

  <!-- Right Body & Sleeve -->
  <path d="M16,11 L21.5,14 L21.5,25 L16,27 Z" fill="url(#fav-r)" />
  <path d="M16,11 L19,5.5 L27.5,10.5 L24.5,16.5 L21.5,14 Z" fill="#3B82F6" />

  <!-- V-Neck Collar -->
  <polygon points="13,5.5 16,9.5 19,5.5 16,7" fill="#93C5FD" />

  <!-- Center Crease -->
  <line x1="16" y1="11" x2="16" y2="27" stroke="#DBEAFE" stroke-width="0.9" opacity="0.9" />

  <!-- Center Apex Dot -->
  <circle cx="16" cy="11" r="1" fill="#FFFFFF" />
</svg>
